<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>إدارة البرج</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>إدارة البرج</h1>
    <p>إدارة المشتركين والتسديدات</p>
  </div>
  <button id="exportBtn" class="secondary">تصدير البيانات</button>
</header>

<main class="container">
  <section class="stats">
    <div class="card"><span>المشتركون</span><strong id="totalSubscribers">0</strong></div>
    <div class="card"><span>المسدّدون</span><strong id="paidCount">0</strong></div>
    <div class="card"><span>المتأخرون</span><strong id="unpaidCount">0</strong></div>
  </section>

  <section class="panel">
    <h2 id="formTitle">إضافة مشترك</h2>
    <form id="subscriberForm">
      <input type="hidden" id="subscriberId">
      <div class="grid">
        <label>اسم المشترك
          <input id="name" required placeholder="مثال: أحمد محمد">
        </label>
        <label>رقم الهاتف
          <input id="phone" required inputmode="tel" placeholder="07xxxxxxxxx">
        </label>
        <label>اسم المستخدم / الحساب
          <input id="account" placeholder="اسم الحساب">
        </label>
        <label>الباقة
          <input id="plan" placeholder="مثال: 20 ميغا">
        </label>
        <label>المبلغ
          <input id="amount" type="number" min="0" step="0.01" placeholder="25000">
        </label>
        <label>تاريخ الاستحقاق
          <input id="dueDate" type="date">
        </label>
      </div>
      <div class="actions">
        <button class="primary" type="submit" id="saveBtn">حفظ المشترك</button>
        <button class="secondary hidden" type="button" id="cancelBtn">إلغاء التعديل</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="toolbar">
      <h2>المشتركون</h2>
      <input id="search" placeholder="بحث بالاسم أو الرقم أو الحساب">
    </div>
    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>الاسم</th><th>الهاتف</th><th>الحساب</th><th>الباقة</th>
            <th>المبلغ</th><th>الاستحقاق</th><th>الحالة</th><th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="subscriberTable"></tbody>
      </table>
    </div>
    <p id="emptyState" class="empty">لا يوجد مشتركون حتى الآن.</p>
  </section>
</main>

<footer>بيانات النسخة التجريبية تُحفظ على هذا الجهاز فقط.</footer>
<script src="app.js"></script>
</body>
</html>
