<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>إدارة البرج - النسخة الجديدة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <div>
    <div class="brand">📡 إدارة البرج</div>
    <div class="sub">إدارة المشتركين والتسديدات</div>
  </div>
  <div class="version">نسخة جديدة</div>
</header>

<main class="wrap">
  <section class="stats">
    <div class="stat"><span>👥 المشتركين</span><b id="total">0</b></div>
    <div class="stat"><span>✅ المسددون</span><b id="paid">0</b></div>
    <div class="stat"><span>🔴 المتأخرون</span><b id="unpaid">0</b></div>
  </section>

  <section class="panel">
    <h2 id="title">إضافة مشترك جديد</h2>
    <form id="form">
      <input id="id" type="hidden">
      <div class="fields">
        <label>اسم المشترك<input id="name" required autocomplete="name"></label>
        <label>رقم الهاتف<input id="phone" required inputmode="tel" placeholder="07700000000"></label>
        <label>اسم الحساب<input id="account" placeholder="مثال: user01"></label>
        <label>الباقة<input id="plan" placeholder="20 ميغا"></label>
        <label>المبلغ<input id="amount" type="number" min="0" step="1" placeholder="25000"></label>
        <label>تاريخ الاستحقاق<input id="due" type="date"></label>
      </div>
      <div class="buttons">
        <button class="save" type="submit">💾 حفظ المشترك</button>
        <button class="cancel hidden" id="cancel" type="button">إلغاء</button>
      </div>
      <div id="message" class="message"></div>
    </form>
  </section>

  <section class="panel">
    <div class="head">
      <h2>قائمة المشتركين</h2>
      <input id="search" placeholder="🔎 بحث بالاسم أو الهاتف">
    </div>
    <div id="list"></div>
    <div id="empty" class="empty">لا توجد بيانات حتى الآن.</div>
  </section>
</main>

<footer>الحفظ المحلي يعمل داخل هذا المتصفح على هذا الجهاز.</footer>
<script src="app.js?v=20261115"></script>
</body>
</html>
